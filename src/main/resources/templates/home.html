<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header('Página Principal')">
</head>
<body>
<header th:replace="fragments/navbar :: navbar"></header>

<main class="container mt-5 pt-5">
    <!-- Mensajes flash para errores y éxitos -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    
    <!-- Section for Announcements -->
    <div class="row my-4">
        <div class="col-lg-12">
            <div id="adCarousel" class="carousel slide" data-ride="carousel" data-interval="5000" data-pause="false" th:if="${ads != null && !ads.empty}">
                <div class="carousel-inner">
                    <div th:each="ad, status : ${ads}" th:class="'carousel-item ' + (${status.first} ? 'active' : '')">
                        <div class="announcement-banner" style="position: relative; text-align: center;">
                            <img th:src="${ad.imageUrl}" 
                                 th:class="${ad.imageUrl != null && ad.imageUrl.endsWith('.gif')} ? 'd-block w-100 gif-preview' : 'd-block w-100'" 
                                 alt="Anuncio" 
                                 style="max-height: 300px; object-fit: cover;"
                                 onerror="this.onerror=null; this.src='/images/placeholder.jpg'; this.style.opacity='0.7';">
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${ads == null || ads.empty}" class="alert alert-info">
                <p>No hay anuncios disponibles en este momento.</p>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- Filter Section -->
        <div class="col-lg-3">
            <div class="filter-container">
                <button class="btn btn-filter">FILTRAR</button>
                <button class="btn btn-sort dropdown-toggle" id="sortButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">ORDENAR</button>
                <div class="dropdown-menu" aria-labelledby="sortButton">
                    <a class="dropdown-item" href="#" data-sort="price-asc">Precio: Menor a Mayor</a>
                    <a class="dropdown-item" href="#" data-sort="price-desc">Precio: Mayor a Menor</a>
                    <a class="dropdown-item" href="#" data-sort="newest">Más Recientes</a>
                </div>
            </div>
            <div class="list-group mt-3">
                <div th:each="category : ${categories}">
                    <label class="list-group-item">
                        <input type="checkbox" th:value="${category.name}"> <span th:text="${category.name}"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Product Section -->
        <div class="col-lg-9">
            <div class="row product-row">
                <div th:each="product : ${products}" class="col-md-4 mb-4">
                    <div class="card h-100 product-card" 
                         th:data-categories="${#strings.arrayJoin(product.categories.![name], ',')}"
                         th:data-price="${product.price}">
                        <!-- Enlace solo en la imagen para redirigir a la vista de detalles del producto -->
                        <div th:if="${product.images.size() > 0}" class="product-image-container">
                            <a th:href="@{/products/details/{id}(id=${product.id})}" class="text-decoration-none">
                                <img th:src="${product.images[0].url}" alt="Imagen del Producto" class="img-fluid" style="width: 100%; height: auto; object-fit: cover;">
                            </a>
                        </div>
                        
                        <!-- Si no tiene imágenes, mostrar una imagen por defecto -->
                        <div th:if="${product.images.size() == 0}" class="product-image-container">
                            <a th:href="@{/products/details/{id}(id=${product.id})}" class="text-decoration-none">
                                <img th:src="@{/images/default-image.png}" alt="Imagen Predeterminada" class="img-fluid" style="width: 100%; height: auto; object-fit: cover;">
                            </a>
                        </div>
                         <!-- Enlace al perfil del usuario que publicó el producto, con estilo para que sea visible -->
                         <div class="seller-info">
                            <a th:href="@{/profile/{userId}(userId=${product.user.id})}" class="seller-name" th:text="${product.user != null ? product.user.username : 'Vendedor Desconocido'}"></a>
                        </div>
                        <!-- Botones que se muestran al hacer hover -->
                        <div class="product-actions">
                            <form th:action="@{/cart/items/add/{productId}(productId=${product.id})}" method="post">
                                <button type="submit" class="btn btn-primary">AGREGAR AL CARRITO</button>
                            </form>
                            <a th:href="@{/purchase/instant-buy/{productId}(productId=${product.id})}" class="btn btn-danger">COMPRAR AHORA</a>
                        </div>
                        <!-- Descripción del producto -->
                        <div class="product">
                            <h3 th:text="${product.name}">Nombre del Producto</h3>
                            <p th:text="${product.description}">Descripción del Producto</p>
                            <span class="card-price" th:text="'$' + ${product.price}">Precio</span>
                            <!-- Categorías ocultas para el filtrado -->
                            <div class="product-categories" style="display: none;">
                                <span th:each="category : ${product.categories}" 
                                      th:text="${category.name}" 
                                      class="category-tag"></span>
                            </div>
                        </div>
                        <!-- Iconos de interacción -->
                        <div class="card-footer d-flex justify-content-between align-items-center">
                            <div class="action-icons">
                                <button class="btn-icon btn-like"><i class="fas fa-heart"></i></button>
                                <a th:href="@{/products/details/{id}(id=${product.id})}" class="btn-icon btn-comment"><i class="fas fa-comment"></i></a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer th:replace="fragments/footer :: footer"></footer>

<!-- Scripts -->
<div th:replace="fragments/footer :: scripts"></div>
<script th:src="@{/js/categories.js}"></script>
<script th:src="@{/js/home.js}"></script>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
