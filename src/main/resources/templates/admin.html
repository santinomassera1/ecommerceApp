<!DOCTYPE html>

<head>

    <title>Panel de Administración</title>

    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">

        <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-4">
            <h2>Bienvenido al Panel de Administración</h2>
