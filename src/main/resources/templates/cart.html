<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="fragments/header :: header('Carrito de Compras')">
</head>
<body>
    <header th:replace="fragments/navbar :: navbar"></header>

    <div class="container mt-5">
        <h1>Tu Carrito de Compras</h1>
    
        <!-- Mensajes flash para errores y éxitos -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
    
        <!-- Verificación de que el carrito y sus items no sean nulos -->
        <div th:if="${cart != null and cart.items != null and cart.items.size() > 0}">
            <table class="table">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Total</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${cart.items}">
                        <td th:text="${item.product.name}">Nombre del Producto</td>
                        <td>
                            <div th:if="${item.product.images != null and item.product.images.size() > 0}">
                                <img th:src="${item.product.images[0].url}" alt="Imagen del Producto" class="img-fluid" style="width: 100px; height: 100px; object-fit: cover;">
                            </div>
                            <div th:if="${item.product.images == null or item.product.images.size() == 0}">
                                <img th:src="@{/images/default-image.png}" alt="Imagen Predeterminada" class="img-fluid" style="width: 100px; height: 100px; object-fit: cover;">
                            </div>
                        </td>
                        <td th:text="'$' + ${item.product.price}">Precio del Producto</td>
                        <td th:text="'$' + ${item.totalPrice}">Precio Total</td>
                        <td>
                            <form th:action="@{/cart/items/remove/{cartItemId}(cartItemId=${item.id})}" method="post">
                                <button class="btn btn-danger" type="submit">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="total-price">
                <h3>Precio Total: <span th:text="'$' + ${totalPrice}"></span></h3>
            </div>
            <div class="cart-actions">
                <form th:action="@{/cart/items/clear}" method="post">
                    <button type="submit" class="btn btn-danger">Vaciar Carrito</button>
                </form>
                <form th:action="@{/purchase}" method="get">
                    <button type="submit" class="btn btn-success">Finalizar Compra</button>
                </form>
            </div>
        </div>

        <div th:if="${cart == null or cart.items == null or cart.items.size() == 0}">
            <p>Tu carrito está vacío</p>
        </div>
    </div>

<footer th:replace="fragments/footer :: footer"></footer>

<!-- Scripts -->
<div th:replace="fragments/footer :: scripts"></div>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
