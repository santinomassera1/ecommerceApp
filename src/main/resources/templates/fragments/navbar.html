<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- Fragmento de la barra de navegación -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center" th:href="@{/home}">
                <img th:src="@{/images/favicon.ico}" alt="Vintage Vogue" class="logo">
                <span class="brand-name">Vintage Vogue</span>
            </a>
            <form id="searchForm" class="form-inline my-2 my-lg-0 flex-grow-1 mx-3 d-flex position-relative">
                <input id="searchInput" class="form-control mr-sm-2 w-100" type="search" placeholder="Buscar" aria-label="Buscar" autocomplete="off">
                <div id="suggestions" class="suggestions-box position-absolute w-100"></div>
            </form>
            <ul class="navbar-nav d-flex align-items-center">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/products/new}" title="Vender">
                        <i class="fas fa-tag"></i>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/cart}" title="Carrito">
                        <i class="fas fa-shopping-cart"></i>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/profile}" title="Perfil">
                        <i class="fas fa-user"></i>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/messages}" title="Mensajes">
                        <i class="fas fa-envelope"></i>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/orders/track}" title="Seguimiento">
                        <i class="fas fa-shipping-fast"></i>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/orders/my-orders}" title="Mis Pedidos">
                        <i class="fas fa-box"></i>
                    </a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link" href="#" id="notificationsDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" title="Notificaciones">
                        <i class="fas fa-bell"></i>
                        <span class="badge badge-danger" id="notificationCount">0</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right" aria-labelledby="notificationsDropdown">
                        <h6 class="dropdown-header">Notificaciones</h6>
                        <div id="notificationsList">
                            <a class="dropdown-item" href="#">No hay nuevas notificaciones</a>
                        </div>
                    </div>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/logout}" title="Cerrar Sesión">
                        <i class="fas fa-sign-out-alt"></i>
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</body>
</html>
