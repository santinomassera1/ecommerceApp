<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento - Vintage Vogue</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" href="/images/favicon.ico" type="image/png">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .maintenance-container {
            max-width: 600px;
            text-align: center;
            padding: 2rem;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .maintenance-icon {
            font-size: 5rem;
            color: #ffc107;
            margin-bottom: 1.5rem;
            animation: pulse 2s infinite;
        }
        
        .maintenance-title {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #343a40;
        }
        
        .maintenance-message {
            font-size: 1.2rem;
            color: #6c757d;
            margin-bottom: 2rem;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }
        
        .countdown {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 1.5rem;
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="maintenance-icon">
            <i class="fas fa-tools"></i>
        </div>
        <h1 class="maintenance-title">Sitio en Mantenimiento</h1>
        <p class="maintenance-message" th:text="${maintenanceMessage}">
            Estamos realizando mejoras en nuestro sitio web. Por favor, vuelve más tarde.
        </p>
        <div class="progress mb-4">
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-warning" role="progressbar" style="width: 75%" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <p>
            Estamos trabajando para mejorar tu experiencia. Gracias por tu paciencia.
        </p>
        <div class="mt-4">
            <a href="/home" class="btn btn-outline-primary">
                <i class="fas fa-sync-alt me-2"></i> Intentar nuevamente
            </a>
        </div>
    </div>
    
    <script src="/vendor/jquery/jquery-3.7.1.min.js"></script>
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
