<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="fragments/header :: header('Detalles del Producto')">
</head>
<body>
<header th:replace="fragments/navbar :: navbar"></header>

<div class="container mt-5">
    <h1>Detalles del Producto</h1>
    <div class="row">
        <div class="col-md-6">
            <!-- Mostrar la primera imagen del producto -->
            <div th:if="${product.images.size() > 0}">
                <img th:src="${product.images[0].url}" alt="Imagen del Producto" class="img-fluid">
            </div>
            <div th:if="${product.images.size() == 0}">
                <p>No hay imagen disponible</p>
            </div>
        </div>
        <div class="col-md-6">
            <h2 th:text="${product.name}">Nombre del Producto</h2>
            <p th:text="${product.description}">Descripción del Producto</p>
            <p><strong>Precio:</strong> $<span th:text="${product.price}"></span></p>
            <p><strong>Disponible:</strong> <span th:text="${product.available ? 'Sí' : 'No'}"></span></p>

            <!-- Sección de comentarios -->
            <div class="comments-section">
                <h3>Comentarios</h3>
                <div th:each="comment : ${comments}">
                    <p>
                        <strong>
                            <a th:href="@{/profile/{userId}(userId=${comment.user.id})}" th:text="${comment.user.username}">Usuario</a>
                        </strong>: 
                        <span th:text="${comment.content}">Contenido del comentario</span>
                    </p>
                    <p><small th:text="${#temporals.format(comment.createdAt, 'dd/MM/yyyy HH:mm')}">Fecha</small></p>
                </div>

                <!-- Formulario para agregar un nuevo comentario -->
                <form th:action="@{/comments/add}" method="post">
                    <input type="hidden" name="productId" th:value="${product.id}" />
                    <div class="form-group">
                        <label for="content">Nuevo Comentario</label>
                        <textarea id="content" name="content" class="form-control" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary mt-2">Enviar</button>
                </form>
            </div>
            
            <!-- Información del usuario que publicó el producto -->
            <p><strong>Vendedor:</strong> 
                <div class="seller-info">
                    <a th:href="@{/profile/{userId}(userId=${product.user.id})}" class="seller-name" th:text="${product.user != null ? product.user.username : 'Vendedor Desconocido'}"></a>
                </div>
            </p>
            <p><strong>Contacto:</strong> <span th:text="${product.user.email}">Email</span></p>
            <!-- Botones para agregar al carrito y comprar -->
            <div class="product-actions">
                <form th:action="@{/cart/items/add/{productId}(productId=${product.id})}" method="post">
                    <button type="submit" class="btn btn-primary">Agregar al Carrito</button>
                </form>
                <form th:action="@{/checkout/{id}(id=${product.id})}" method="post">
                    <button type="submit" class="btn btn-danger btn-lg">Comprar Ahora</button>
                </form>
            </div>
        </div>
    </div>
</div>

<footer th:replace="fragments/footer :: footer"></footer>

<!-- Scripts -->
<div th:replace="fragments/footer :: scripts"></div>
<script th:src="@{/js/comment.js}"></script>
</body>
</html>
