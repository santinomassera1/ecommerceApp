<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="fragments/header :: header('Confirmación de Pedido')">
</head>
<body>
<header th:replace="fragments/navbar :: navbar"></header>

<div class="container mt-5 text-center">
    <h1><i class="fas fa-check-circle text-success"></i> ¡Pedido Confirmado!</h1>
    <p th:text="${confirmationMessage}">Gracias por tu compra.</p>
    
    <!-- Información del seguimiento -->
    <div th:if="${order}" class="alert alert-success mt-4">
        <h5><i class="fas fa-shipping-fast"></i> Información de Envío</h5>
        <p class="mb-2">
            <strong>Número de seguimiento:</strong> 
            <span class="badge badge-primary" th:text="${order.trackingNumber}"></span>
        </p>
        <p class="mb-2">
            <strong>Estado:</strong> <span th:text="${order.statusDescription}"></span>
        </p>
        <div class="mt-3">
            <a th:href="@{'/orders/track/' + ${order.trackingNumber}}" class="btn btn-info">
                <i class="fas fa-search-location"></i> Hacer Seguimiento del Pedido
            </a>
        </div>
    </div>
    
    <p class="text-muted">Revisa tu email para más detalles sobre el pedido y notificaciones de envío.</p>

    <!-- Order Summary -->
    <div class="card mt-4">
        <div class="card-header">
            <h5><i class="fas fa-shopping-bag"></i> Resumen del Pedido</h5>
        </div>
        <div class="card-body">
            <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex align-items-center" th:each="item : ${cartItems}">
                    <img th:if="${item.product.images != null and item.product.images.size() > 0}"
                         th:src="${item.product.images[0].url}" 
                         alt="Imagen del Producto" 
                         class="img-fluid rounded" 
                         style="width: 50px; height: 50px; object-fit: cover; margin-right: 15px;">
                    <div th:if="${item.product.images == null or item.product.images.size() == 0}"
                         class="bg-light d-flex align-items-center justify-content-center rounded mr-3"
                         style="width: 50px; height: 50px;">
                        <i class="fas fa-image text-muted"></i>
                    </div>
                    <div class="flex-grow-1">
                        <strong th:text="${item.product.name}"></strong>
                        <small class="text-muted d-block" th:text="${item.product.description}"></small>
                    </div>
                    <div class="text-right">
                        <span th:text="${item.quantity}"></span> x $<span th:text="${item.product.price}"></span>
                        <div class="font-weight-bold">$<span th:text="${item.totalPrice}"></span></div>
                    </div>
                </li>
            </ul>
        </div>
        <div class="card-footer text-right">
            <h4 class="text-primary mb-0">Total: $<span th:text="${total}"></span></h4>
        </div>
    </div>

    <!-- Action buttons -->
    <div class="mt-4">
        <a th:href="@{/orders/my-orders}" class="btn btn-outline-primary">
            <i class="fas fa-list"></i> Ver Mis Pedidos
        </a>
        <a th:href="@{/home}" class="btn btn-primary">
            <i class="fas fa-home"></i> Continuar Comprando
        </a>
    </div>
</div>

<footer th:replace="fragments/footer :: footer"></footer>

<!-- Scripts -->
<div th:replace="fragments/footer :: scripts"></div>
</body>
</html>
