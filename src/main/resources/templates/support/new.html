<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Ticket de Soporte - Vintage Vogue</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="icon" href="/images/favicon.ico" type="image/png">
</head>
<body>
<header class="header">
    <div class="d-flex align-items-center">
        <a th:href="@{/support}" class="d-flex align-items-center text-decoration-none">
            <img src="/images/favicon.ico" alt="Logo" class="me-2" style="height: 30px;">
            <h1>Panel de Soporte</h1>
        </a>
    </div>
    <div class="header-nav">
        <a class="nav-link" th:href="@{/support}">
            <i class="fas fa-ticket-alt me-1"></i> Tickets
        </a>
        <a class="nav-link active" th:href="@{/support/new}">
            <i class="fas fa-plus-circle me-1"></i> Nuevo Ticket
        </a>
    </div>
    <div>
        <a class="nav-link me-2" th:href="@{/home}">
            <i class="fas fa-store me-1"></i> Ver Tienda
        </a>
        <a class="nav-link" th:href="@{/logout}">
            <i class="fas fa-sign-out-alt me-1"></i> Cerrar Sesión
        </a>
    </div>
</header>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 d-none d-md-block sidebar">
            <div class="sidebar-sticky">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="/support">
                            <i class="fas fa-ticket-alt"></i> Ver Tickets
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/support/new">
                            <i class="fas fa-plus-circle"></i> Crear Nuevo Ticket
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main content -->
        <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h2>Crear Nuevo Ticket de Soporte</h2>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a href="/support" class="btn btn-secondary">
                        <i class="fas fa-arrow-left me-1"></i> Volver a Tickets
                    </a>
                </div>
            </div>
            
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card mb-4">
                        <div class="card-header">
                            <i class="fas fa-edit me-1"></i>
                            Formulario de Ticket
                        </div>
                        <div class="card-body">
                            <form th:action="@{/support/create}" th:object="${ticket}" method="post">
                                <div class="mb-3">
                                    <label for="subject" class="form-label">Asunto:</label>
                                    <input type="text" class="form-control" id="subject" th:field="*{subject}" required 
                                           placeholder="Escribe un título descriptivo para tu ticket">
                                </div>
                                
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="category" class="form-label">Categoría:</label>
                                        <select class="form-control" id="category" th:field="*{category}" required>
                                            <option value="">Selecciona una categoría</option>
                                            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="priority" class="form-label">Prioridad:</label>
                                        <select class="form-control" id="priority" th:field="*{priority}">
                                            <option value="1">Alta</option>
                                            <option value="2" selected>Media</option>
                                            <option value="3">Baja</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="description" class="form-label">Descripción:</label>
                                    <textarea class="form-control" id="description" th:field="*{description}" rows="5" required
                                              placeholder="Describe tu problema o consulta con el mayor detalle posible"></textarea>
                                </div>
                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-success">
                                        <i class="fas fa-paper-plane me-1"></i> Enviar Ticket
                                    </button>
                                    <a href="/support" class="btn btn-outline-secondary">
                                        <i class="fas fa-times me-1"></i> Cancelar
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<footer class="footer">
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <p class="mb-0">&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2024</span> Vintage Vogue</p>
            </div>
            <div class="col-md-6 text-md-end">
                <p class="mb-0">Panel de Soporte v1.0</p>
            </div>
        </div>
    </div>
</footer>

<script src="/vendor/jquery/jquery-3.7.1.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
