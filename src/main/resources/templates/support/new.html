<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Support Ticket</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<header class="header d-flex justify-content-between align-items-center p-3 bg-dark text-white">
    <h1>Support Panel</h1>
    <a class="nav-link" th:href="@{/logout}">Logout</a>
</header>

<div class="container-fluid mt-4">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 d-none d-md-block bg-light sidebar">
            <div class="sidebar-sticky">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="/support">
                            <i class="fas fa-ticket-alt"></i> View Tickets
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/support/new">
                            <i class="fas fa-plus-circle"></i> Create New Ticket
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main content -->
        <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-4">
            <h2>Create Support Ticket</h2>
            <div class="card p-4">
                <form th:action="@{/support/create}" th:object="${ticket}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Subject:</label>
                        <input type="text" class="form-control" th:field="*{subject}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description:</label>
                        <textarea class="form-control" th:field="*{description}" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Submit</button>
                    <a href="/support" class="btn btn-secondary mt-3">Back</a>
                </form>
            </div>
        </main>
    </div>
</div>

<footer>
    <div class="footer-bottom">
        <p>&copy; 2024 Vintage Vogue. All rights reserved.</p>
    </div>
</footer>

<script src="/vendor/jquery/jquery-3.7.1.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
